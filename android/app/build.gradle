plugins {
    id 'com.android.application'
}

android {
    namespace 'app.indm.remote'
    compileSdk 34

    defaultConfig {
        applicationId 'app.indm.remote'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        // A fixed key, so a newer APK can be installed over an older one. It is not secret (this app only
        // talks to your own PC on your own Wi-Fi). Replace it with your own key if you publish the app.
        release {
            storeFile file('indm-sideload.jks')
            storePassword 'indm-sideload'
            keyAlias 'indm'
            keyPassword 'indm-sideload'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}
