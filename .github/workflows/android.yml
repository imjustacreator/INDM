name: Build Android APK

# Run it by hand: Actions tab > "Build Android APK" > Run workflow.
# The APK appears at the bottom of the run page, under "Artifacts".
on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build the APK
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease

      - name: Name the file
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/INDM-Remote.apk

      - uses: actions/upload-artifact@v4
        with:
          name: INDM-Remote-apk
          path: out/INDM-Remote.apk
          if-no-files-found: error
